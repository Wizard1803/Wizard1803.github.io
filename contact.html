  <!-- Global Nav Capsule -->
  <nav class="nav-capsule glass-panel">
    <div class="nav-brand" style="display: flex; align-items: center; gap: 0.75rem;">
      <span class="status-dot"></span>
      <div class="nav-logo">PIYUSH</div>
    </div>
    <div class="nav-links">

        <div class="contact-badge" id="contact-badge">

          <span id="contact-badge-text"></span>

        <p class="contact-statement" id="contact-statement"></p>

        <!-- Channel Rows -->
        <div class="contact-channels" id="contact-channels">
