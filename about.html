<!-- about.html — About page -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Favicons -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
  <link rel="manifest" href="assets/favicon/site.webmanifest">
  <title>About — WIZARD</title>
  <meta name="description" content="Piyush Kumawat — cybersecurity student, penetration tester in training. Skills, certifications, and education.">

  <!-- CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/transitions.css">
  
  <link rel="stylesheet" href="css/pages/about.css">

  <!-- GSAP CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js" defer></script>

  
  <script src="https://cdn.jsdelivr.net/npm/vanilla-tilt@1.8.1/dist/vanilla-tilt.min.js" defer></script>
  <!-- JS -->
  <script src="js/utils.js" defer></script>
  <script src="js/content-loader.js" defer></script>
  <script src="js/cursor.js" defer></script>
  <script src="js/nav.js" defer></script>
  <script src="js/command-palette.js" defer></script>
  <script src="js/skill-bars.js" defer></script>
  <script src="js/navbar.js" defer></script>

  <script src="js/magnetic-physics.js" defer></script>
</head>
<body>
  <!-- Global Nav Capsule -->
  <nav class="nav-capsule glass-panel">
    <div class="nav-brand" style="display: flex; align-items: center; gap: 0.75rem;">
      <span class="status-dot"></span>
      <div class="nav-logo">PIYUSH</div>
    </div>
    <div class="nav-links">
      <a href="index.html" class="nav-link" data-text="Home"><span class="nav-text">Home</span></a>
      <a href="about.html" class="nav-link active" data-text="About"><span class="nav-text">About</span></a>
      <a href="projects.html" class="nav-link" data-text="Projects"><span class="nav-text">Projects</span></a>
      <a href="labs.html" class="nav-link" data-text="Labs"><span class="nav-text">Labs</span></a>
      <a href="contact.html" class="nav-link" data-text="Contact"><span class="nav-text">Contact</span></a>
    </div>
    <button class="nav-cmd-trigger" aria-label="Open Command Palette"><span class="mono" style="font-size: 0.85em; opacity: 0.7;">CTRL</span> K</button>
  </nav>

  <main id="swup-root">
    <section class="about-page">
      <div class="about-container">

        <!-- BIO -->
        <div class="about-bio-section">
          <div class="section-header">
            <span class="dimension-dot"></span>
            <h2>About</h2>
            <span class="dimension-line"></span>
          </div>
          <p class="about-bio-text" id="about-bio"></p>
        </div>

        <!-- SKILLS — Redline Bars -->
        <div class="about-skills-section">
          <div class="section-header">
            <span class="dimension-dot"></span>
            <h2>Skill Bars</h2>
            <span class="dimension-line"></span>
          </div>
          <div class="skill-bars-container" id="skill-bars-container">
            <!-- Rendered dynamically by skill-bars.js -->
          </div>
        </div>

        <!-- TAGS — All skills as pills -->
        <div class="about-tags-section">
          <div class="section-header">
            <span class="dimension-dot"></span>
            <h2>Toolbox</h2>
            <span class="dimension-line"></span>
          </div>
          <div class="tags-wrap" id="about-tags-wrap">
            <!-- Rendered dynamically by skill-bars.js -->
          </div>
        </div>

        <!-- CERTIFICATIONS -->
        <div class="about-certs-section">
          <div class="section-header">
            <span class="dimension-dot"></span>
            <h2>Certifications</h2>
            <span class="dimension-line"></span>
          </div>
          <div class="cert-grid" id="cert-grid">
            <!-- Rendered dynamically by skill-bars.js -->
          </div>
        </div>

        <!-- EDUCATION -->
        <div class="about-education-section">
          <div class="section-header">
            <span class="dimension-dot"></span>
            <h2>Education</h2>
            <span class="dimension-line"></span>
          </div>
          <div class="education-block" id="education-block">
            <!-- Rendered dynamically by skill-bars.js -->
          </div>
        </div>

      </div>
    </section>
  </main>
</body>
</html>
